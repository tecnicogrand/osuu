<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>osu! Web Ultimate Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Torus:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ui-font: 'Varela Round', sans-serif;
            --score-font: 'Torus', 'Varela Round', sans-serif;
            --primary: #ff66aa;
            --primary-hover: #ff88bb;
        }

        html, body {
            margin: 0; padding: 0; overflow: hidden;
            width: 100vw; height: 100vh;
            background-color: #050505; font-family: var(--ui-font);
            color: white; user-select: none; -webkit-user-select: none;
            touch-action: none; /* CRITICAL: Prevents mobile scrolling */
            cursor: none; /* Hide default cursor */
        }

        /* YouTube Background */
        #ytContainer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.15; z-index: -1; pointer-events: none; /* Prevents iframe from stealing clicks */
            transition: opacity 0.5s ease;
        }
        .playing-dim { opacity: 0.05 !important; }

        /* Canvas */
        #gameCanvas {
            display: block; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 10;
        }
        
        #flashOverlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: white; opacity: 0; z-index: 11; pointer-events: none;
            transition: opacity 0.1s ease-out;
        }

        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 20; display: flex; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: none;
        }

        .glass-panel {
            pointer-events: auto; background: rgba(15, 10, 20, 0.85);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 102, 170, 0.3); border-radius: 24px;
            padding: 3rem; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 102, 170, 0.05);
            width: 90%; max-width: 550px; text-align: center;
        }

        .input-box {
            width: 100%; padding: 14px 20px; border-radius: 12px;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 102, 170, 0.3);
            color: white; font-family: var(--ui-font); font-size: 1rem; margin-bottom: 1rem;
            transition: all 0.2s; pointer-events: auto;
        }
        .input-box:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px rgba(255, 102, 170, 0.4); }

        .btn {
            background: var(--primary); border: none; color: white;
            padding: 14px 28px; font-size: 1.1rem; font-weight: bold; font-family: var(--ui-font);
            border-radius: 50px; cursor: pointer; pointer-events: auto;
            box-shadow: 0 5px 20px rgba(255, 102, 170, 0.3);
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 102, 170, 0.5); }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 10px rgba(255, 102, 170, 0.3); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); box-shadow: none; color: var(--primary); }
        .btn-outline:hover { background: rgba(255, 102, 170, 0.1); }

        .hidden { display: none !important; }

        .hud { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 15; }
        
        .hud-health-bg {
            position: absolute; top: 15px; left: 15px; width: 35vw; height: 18px;
            background: rgba(0,0,0,0.7); border: 2px solid rgba(255,255,255,0.8);
            border-radius: 10px; overflow: hidden; transform: skewX(-15deg);
        }
        .hud-health-fill {
            height: 100%; width: 100%; background: linear-gradient(90deg, #ff3333, #ffcc00, #33ff55);
            transition: width 0.1s linear;
        }

        .hud-score { position: absolute; top: 10px; right: 20px; text-align: right; }
        .hud-score-text { font-family: var(--score-font); font-size: 3.5rem; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 5px #000, 0 0 10px rgba(0,0,0,0.8); line-height: 1; }
        .hud-acc-text { font-family: var(--score-font); font-size: 1.8rem; font-weight: bold; color: #e0e0e0; text-shadow: 0 2px 4px #000; }

        .hud-combo {
            position: absolute; bottom: 20px; left: 20px;
            font-family: var(--score-font); font-size: 4.5rem; font-weight: 900;
            text-shadow: 0 3px 6px #000, 0 0 15px rgba(0,0,0,0.5);
            transition: transform 0.05s; transform-origin: bottom left;
        }
        .combo-pulse { transform: scale(1.15); color: var(--primary); }

        /* Key Input Visualizer */
        .key-visualizer {
            position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 8px;
        }
        .key-box {
            width: 45px; height: 45px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.4);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; font-weight: bold; font-family: var(--score-font);
            background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.4); transition: all 0.05s;
        }
        .key-active { background: var(--primary); border-color: #fff; color: #fff; box-shadow: 0 0 15px var(--primary); transform: scale(0.9); }

        /* Grades */
        .grade-SS { color: #e4e4e4; text-shadow: 0 0 30px #fff, 0 0 10px #fff; }
        .grade-S { color: #ffd700; text-shadow: 0 0 30px #ffd700, 0 0 10px #ffd700; }
        .grade-A { color: #33ff55; text-shadow: 0 0 30px #33ff55; }
        .grade-B { color: #33aaff; text-shadow: 0 0 30px #33aaff; }
        .grade-C { color: #ff8800; text-shadow: 0 0 30px #ff8800; }
        .grade-D { color: #ff3333; text-shadow: 0 0 30px #ff3333; }
        
        .progress-bar-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.6); z-index: 15;}
        .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); box-shadow: 0 0 10px var(--primary); }

        #editorUI {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 120px;
            background: rgba(10, 10, 15, 0.9); border-top: 1px solid var(--primary);
            z-index: 30; display: flex; flex-direction: column; pointer-events: auto;
        }
        .editor-timeline { width: 100%; height: 40px; background: #222; position: relative; cursor: pointer; }
        .editor-playhead { position: absolute; top: 0; width: 2px; height: 100%; background: #ff0000; z-index: 5; pointer-events: none;}
        .editor-note { position: absolute; top: 10px; width: 10px; height: 20px; background: var(--primary); border-radius: 5px; }
        .editor-controls { display: flex; justify-content: center; align-items: center; padding: 10px; gap: 10px; }
        .editor-btn { background: #333; color: white; border: none; padding: 8px 16px; border-radius: 5px; cursor: pointer; }
        .editor-btn:hover { background: #555; }
        
        textarea#exportArea { width: 100%; height: 80px; background: #000; color: #0f0; font-family: monospace; font-size: 10px; margin-top: 10px; resize: none;}
    </style>
</head>
<body>

<!-- YouTube Background -->
<div id="ytContainer"><div id="ytPlayer"></div></div>

<!-- Main Game Canvas -->
<canvas id="gameCanvas"></canvas>
<div id="flashOverlay"></div>

<div id="mainMenu" class="ui-layer">
    <div class="glass-panel">
        <h1 class="text-6xl font-black mb-1" style="color: var(--primary); text-shadow: 0 0 25px rgba(255,102,170,0.6);">osu!</h1>
        <p class="text-sm font-bold tracking-widest text-pink-300 mb-6 opacity-80">WEB ULTIMATE</p>
        
        <input type="text" id="ytInput" class="input-box" placeholder="YouTube Video URL" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        
        <div class="flex gap-2 mb-4">
            <select id="diffSelect" class="input-box mb-0 flex-1">
                <option value="easy">Easy</option>
                <option value="normal" selected>Normal</option>
                <option value="hard">Hard</option>
            </select>
            <select id="modeSelect" class="input-box mb-0 flex-1">

        <div class="grid grid-cols-2 gap-3 mt-2">

    </div>
</div>

<div id="hud" class="hud hidden">
    <div class="hud-health-bg"><div id="healthFill" class="hud-health-fill"></div></div>
    
    <div class="hud-score">
        <div id="scoreTxt" class="hud-score-text">00000000</div>

    </div>
    
    <div id="comboTxt" class="hud-combo">0x</div>
    
    <div class="key-visualizer">
        <div id="keyM1" class="key-box text-xs">M1</div>

        <div id="keyZ" class="key-box">Z</div>
        <div id="keyX" class="key-box">X</div>
    </div>
    
    <div class="progress-bar-container"><div id="songProgress" class="progress-bar-fill"></div></div>
</div>

<div id="editorUI" class="hidden">
    <div class="editor-timeline" id="eTimeline">
        <div class="editor-playhead" id="ePlayhead"></div>
        <div id="eNotesContainer"></div>
    </div>
    <div class="editor-controls">
        <button class="editor-btn" id="eBtnPlayPause">Play/Pause</button>
        <button class="editor-btn" id="eBtnClear">Clear Notes</button>
        <button class="editor-btn" id="eBtnExport">Export JSON</button>
        <button class="editor-btn" id="eBtnImport">Import JSON</button>
        <button class="btn px-6 py-2 ml-auto text-sm" id="eBtnExit">Exit Editor</button>
    </div>
    <div id="exportContainer" class="hidden px-4">
        <textarea id="exportArea"></textarea>
    </div>
</div>

<div id="resultsScreen" class="ui-layer hidden">
    <div class="glass-panel" style="max-width: 700px; width: 95%;">
        <div class="flex justify-between items-center border-b border-pink-900 pb-4 mb-6">
            <div class="text-left">
                <h2 id="resTitle" class="text-4xl font-black text-pink-400 uppercase">Map Cleared</h2>
                <p id="resDiff" class="text-gray-400 font-bold">Difficulty: Normal</p>
            </div>
            <div id="resGrade" class="text-8xl font-black grade-S" style="line-height: 0.8;">S</div>
        </div>
        
        <div class="flex flex-col md:flex-row gap-6 mb-6">
            <div class="flex-1 text-left bg-black bg-opacity-40 p-5 rounded-xl border border-gray-800">
                <p class="text-gray-400 font-bold text-sm tracking-widest">TOTAL SCORE</p>
                <p id="resScore" class="text-5xl font-black font-[Torus] mb-4">00000000</p>
                <div class="flex justify-between mt-2">
                    <div><p class="text-gray-400 font-bold text-xs">MAX COMBO</p><p id="resMaxCombo" class="text-2xl font-bold font-[Torus]">0x</p></div>
                    <div class="text-right"><p class="text-gray-400 font-bold text-xs">ACCURACY</p><p id="resAcc" class="text-2xl font-bold font-[Torus]">100.00%</p></div>
                </div>
            </div>
            <div class="w-full md:w-1/3 grid grid-cols-2 gap-3 text-left bg-black bg-opacity-40 p-5 rounded-xl border border-gray-800 font-bold text-xl font-[Torus]">
                <div style="color: #66ccff;">300: <span id="r300">0</span></div>
                <div style="color: #88ff44;">100: <span id="r100">0</span></div>
                <div style="color: #ffcc22;">50: <span id="r50">0</span></div>

            </div>
        </div>

        <div id="lbSubmitSection" class="mb-6 p-5 bg-pink-900 bg-opacity-20 border border-pink-700 rounded-xl hidden">
            <p class="text-pink-300 font-bold mb-3 text-left">Submit High Score to Global Rankings</p>
            <div class="flex gap-2">
                <input type="text" id="playerName" class="input-box m-0 flex-1" placeholder="Enter your name" maxlength="15">
                <button id="btnSubmitScore" class="btn px-8">Submit</button>
            </div>
            <p id="submitStatus" class="mt-2 text-sm text-green-400 font-bold hidden">Score submitted!</p>
        </div>
        
        <button id="btnBackMenu" class="btn btn-outline w-full">Back to Menu</button>
    </div>
</div>

<div id="leaderboardScreen" class="ui-layer hidden">
    <div class="glass-panel" style="max-width: 600px; width: 95%;">
        <h2 class="text-3xl font-black text-pink-400 mb-4 border-b border-pink-900 pb-3 uppercase tracking-wider">Global Rankings</h2>
        <div id="lbList" class="text-left overflow-y-auto max-h-[50vh] mb-6 pr-2" style="scrollbar-width: thin; scrollbar-color: var(--primary) transparent;">
            <p class="text-center text-pink-300 animate-pulse py-10">Connecting to database...</p>
        </div>
        <button id="btnCloseLB" class="btn btn-outline w-full">Close</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.appId = typeof __app_id !== 'undefined' ? __app_id : 'osu-ultimate-web-v2';
    let db, auth, user, isReady = false;

    async function initFb() {
        try {
            if (typeof __firebase_config !== 'undefined') {
                const app = initializeApp(JSON.parse(__firebase_config));
                db = getFirestore(app);
                auth = getAuth(app);
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                user = auth.currentUser;
                isReady = !!user;
            }
        } catch (e) { console.warn("Firebase offline.", e); }
    }
    initFb();

    window.fbDb = () => db;
    window.fbUser = () => user;
    window.fbReady = () => isReady;
    window.fbAddDoc = addDoc;
    window.fbCollection = collection;
    window.fbGetDocs = getDocs;
    window.fbTimestamp = serverTimestamp;
</script>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let width, height;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game Constants
    const COLORS = ['#00AAFF', '#FF00AA', '#00FF22', '#FFAA00'];
    let approachRate = 1200; // ms
    let circleRadius = 55;
    const HIT_WINDOWS = { 300: 50, 100: 100, 50: 150, miss: 200 };

    // Global State
    let gameState = 'menu'; // menu, playing, editing, results
    let activeObjects = [];
    let hitTexts = [];
    let particles = [];
    let cursorTrail = [];
    let shakeAmount = 0;
    let customBeatmap = []; // Stores map data for custom/editor

    // Input tracking (Crucial for precise mechanics)
    let mouseX = width / 2;
    let mouseY = height / 2;
    let isHolding = false;
    let lastMouseX = mouseX, lastMouseY = mouseY;
    let spinnerRot = 0; // Accumulated rotation for spinner
    
    const inputState = { m1: false, m2: false, z: false, x: false };
    let stats = { score: 0, combo: 0, maxCombo: 0, health: 100, hits: {300:0, 100:0, 50:0, miss:0} };

    // YouTube API
    let ytPlayer, ytDuration = 0, currentVidId = '';
    
    window.onYouTubeIframeAPIReady = function() {
        ytPlayer = new YT.Player('ytPlayer', {
            height: '100%', width: '100%',
            playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, showinfo: 0, modestbranding: 1, iv_load_policy: 3 },
            events: { onStateChange: onYTStateChange }
        });
    };
    
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function extractVidId(url) {
        let m = url.match(/(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
        return (m && m[1].length === 11) ? m[1] : 'dQw4w9WgXcQ';
    }

    function updateMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        lastMouseX = mouseX; lastMouseY = mouseY;
        // Exact coordinate mapping
        mouseX = (e.clientX - rect.left) * (canvas.width / rect.width);
        mouseY = (e.clientY - rect.top) * (canvas.height / rect.height);
    }

    window.addEventListener('mousemove', updateMousePos);

    function handleInputDown() {
        isHolding = true;
        if (gameState === 'editing') {
            addNoteToBeatmap(mouseX, mouseY);
            return;
        }
        
        if (gameState !== 'playing' || !ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
        
        let tMs = ytPlayer.getCurrentTime() * 1000;
        
        // Find hit object
        for (let i = 0; i < activeObjects.length; i++) {
            let obj = activeObjects[i];
            if (!obj.active || tMs < obj.spawnTime) continue; 
            
            if (obj.type === 'circle' || obj.type === 'slider') {
                // Check dist to start circle
                let dist = Math.hypot(mouseX - obj.x, mouseY - obj.y);
                if (dist <= circleRadius) {
                    let timeDiff = Math.abs(tMs - obj.targetTime);
                    if (timeDiff <= HIT_WINDOWS.miss) {
                        let scoreVal = 0;
                        if (timeDiff <= HIT_WINDOWS[300]) scoreVal = 300;
                        else if (timeDiff <= HIT_WINDOWS[100]) scoreVal = 100;
                        else if (timeDiff <= HIT_WINDOWS[50]) scoreVal = 50;
                        
                        if (obj.type === 'circle') {
                            registerHit(obj, scoreVal);
                        } else if (obj.type === 'slider') {
                            // Slider hit initiated
                            obj.isTracking = true;
                            obj.startHitVal = scoreVal;
                            // Flash effect on hit
                            if(scoreVal === 300) screenFlash();
                        }
                        return; // Hit one object per click
                    }
                }
            }
        }
    }

    function handleInputUp() {
        isHolding = false;
        
        // Check sliders release
        if (gameState === 'playing') {
             for (let i = 0; i < activeObjects.length; i++) {
                 let obj = activeObjects[i];
                 if (obj.active && obj.type === 'slider' && obj.isTracking) {
                     obj.isTracking = false; // Released early = miss or partial score handled in loop
                 }
             }
        }
    }

    // Bindings
    window.addEventListener('mousedown', (e) => {
        if(gameState === 'playing' || gameState === 'editing') e.preventDefault();
        updateMousePos(e);
        if (e.button === 0) { inputState.m1 = true; handleInputDown(); }
        if (e.button === 2) { inputState.m2 = true; handleInputDown(); }
        updateKeyUI();
    }, { passive: false });

    window.addEventListener('mouseup', (e) => {
        if (e.button === 0) inputState.m1 = false;
        if (e.button === 2) inputState.m2 = false;
        if(!inputState.m1 && !inputState.m2 && !inputState.z && !inputState.x) handleInputUp();
        updateKeyUI();
    });

    window.addEventListener('keydown', (e) => {
        if (e.repeat) return; 
        let k = e.key.toLowerCase();
        if (k === 'z' || k === 'x') {
            if(gameState === 'playing' || gameState === 'editing') e.preventDefault();
            inputState[k] = true;
            handleInputDown();
            updateKeyUI();
        }
    }, { passive: false });

    window.addEventListener('keyup', (e) => {
        let k = e.key.toLowerCase();
        if (k === 'z' || k === 'x') {
            inputState[k] = false;
            if(!inputState.m1 && !inputState.m2 && !inputState.z && !inputState.x) handleInputUp();
            updateKeyUI();
        }
    });

    window.addEventListener('contextmenu', e => { if(gameState==='playing'||gameState==='editing') e.preventDefault(); });

    // Touch
    window.addEventListener('touchstart', (e) => {
        if(gameState === 'playing'||gameState==='editing') e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        mouseX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
        mouseY = (e.touches[0].clientY - rect.top) * (canvas.height / rect.height);
        inputState.m1 = true; handleInputDown(); updateKeyUI();
    }, { passive: false });
    
    window.addEventListener('touchend', (e) => {
        inputState.m1 = false; handleInputUp(); updateKeyUI();
    });

    class HitObject {
        constructor(time, colorIdx, num) {
            this.targetTime = time;
            this.spawnTime = time - approachRate;
            this.color = COLORS[colorIdx % COLORS.length];
            this.num = num;
            this.active = true;
        }
        drawApproach(ctx, progress, x, y) {
            if (progress <= 1.0) {
                let scale = 1 + 2 * (1 - progress); 
                ctx.beginPath(); ctx.arc(x, y, circleRadius * scale, 0, Math.PI * 2);
                ctx.lineWidth = 4; ctx.strokeStyle = this.color; ctx.stroke();
            }
        }
        drawCircleBody(ctx, x, y, num, alpha) {
            ctx.globalAlpha = alpha;
            ctx.beginPath(); ctx.arc(x, y, circleRadius, 0, Math.PI * 2);
            let grad = ctx.createRadialGradient(x, y, 0, x, y, circleRadius);
            grad.addColorStop(0, '#ffffff'); grad.addColorStop(0.2, this.color);
            grad.addColorStop(0.9, this.color); grad.addColorStop(1, '#111');
            ctx.fillStyle = grad; ctx.fill();
            
            ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
            ctx.beginPath(); ctx.arc(x, y, circleRadius+1, 0, Math.PI*2);
            ctx.lineWidth = 1; ctx.strokeStyle = '#000'; ctx.stroke();

            ctx.fillStyle = '#fff'; ctx.font = `bold ${circleRadius * 0.8}px var(--ui-font)`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 4;
            ctx.fillText(num, x, y + 2); ctx.shadowBlur = 0;
            ctx.globalAlpha = 1;
        }
    }

    class Circle extends HitObject {
        constructor(time, x, y, colorIdx, num) {
            super(time, colorIdx, num);
            this.type = 'circle'; this.x = x; this.y = y;
        }
        draw(ctx, tMs) {
            if (!this.active) return;
            let progress = (tMs - this.spawnTime) / approachRate;
            if (progress < 0 || progress > 1.2) return;
            let alpha = Math.min(1, progress * 4);
            
            this.drawCircleBody(ctx, this.x, this.y, this.num, alpha);
            this.drawApproach(ctx, progress, this.x, this.y);
        }
    }

    class Slider extends HitObject {
        constructor(time, x, y, endX, endY, colorIdx, num) {
            super(time, colorIdx, num);
            this.type = 'slider'; this.x = x; this.y = y;
            this.endX = endX; this.endY = endY;
            this.duration = 600; // time to travel
            this.endTime = time + this.duration;
            this.isTracking = false;
            this.startHitVal = 0;
        }
        draw(ctx, tMs) {
            if (!this.active) return;
            let progress = (tMs - this.spawnTime) / approachRate;
            if (progress < 0) return;
            
            let alpha = Math.min(1, progress * 4);
            ctx.globalAlpha = alpha;

            // Draw Path
            ctx.beginPath();
            ctx.moveTo(this.x, this.y); ctx.lineTo(this.endX, this.endY);
            ctx.lineWidth = circleRadius * 2;
            ctx.strokeStyle = `rgba(50, 50, 50, 0.5)`; ctx.lineCap = 'round'; ctx.stroke();
            ctx.lineWidth = circleRadius * 2 - 4;
            ctx.strokeStyle = this.color; ctx.stroke();

            // Draw End Circle
            this.drawCircleBody(ctx, this.endX, this.endY, "", alpha);
            
            if (tMs < this.targetTime) {
                // Draw Start Circle & Approach
                this.drawCircleBody(ctx, this.x, this.y, this.num, alpha);
                this.drawApproach(ctx, progress, this.x, this.y);
            } else if (tMs <= this.endTime) {
                // Draw Moving Ball
                let slideProgress = (tMs - this.targetTime) / this.duration;
                let bx = this.x + (this.endX - this.x) * slideProgress;
                let by = this.y + (this.endY - this.y) * slideProgress;
                
                // Track logic
                if (this.isTracking) {
                    let dist = Math.hypot(mouseX - bx, mouseY - by);
                    if (dist > circleRadius * 1.5) this.isTracking = false; // Mouse slipped off
                    else {
                        // Highlight slider ball
                        ctx.beginPath(); ctx.arc(bx, by, circleRadius*1.2, 0, Math.PI*2);
                        ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.fill();
                    }
                }
                
                this.drawCircleBody(ctx, bx, by, "", alpha);
            }
            ctx.globalAlpha = 1;
        }
    }

    class Spinner extends HitObject {
        constructor(time, duration) {
            super(time, 0, "");
            this.type = 'spinner';
            this.endTime = time + duration;
            this.rot = 0;
            this.reqRots = (duration / 1000) * Math.PI * 4; // required rotations based on duration
        }
        draw(ctx, tMs) {
            if (!this.active) return;
            if (tMs < this.spawnTime || tMs > this.endTime) return;
            
            let alpha = tMs < this.targetTime ? (tMs - this.spawnTime)/(approachRate) : 1;
            ctx.globalAlpha = alpha;
            
            let cx = width/2, cy = height/2;
            let maxR = Math.min(width, height) * 0.4;
            
            // Spin logic if active
            if (tMs >= this.targetTime && isHolding) {
                let a1 = Math.atan2(lastMouseY - cy, lastMouseX - cx);
                let a2 = Math.atan2(mouseY - cy, mouseX - cx);
                let diff = a2 - a1;
                // handle wraparound
                if (diff > Math.PI) diff -= Math.PI*2;
                if (diff < -Math.PI) diff += Math.PI*2;
                this.rot += Math.abs(diff);
            }

            // Draw outer ring
            ctx.beginPath(); ctx.arc(cx, cy, maxR, 0, Math.PI*2);
            ctx.strokeStyle = '#00AAFF'; ctx.lineWidth = 10; ctx.stroke();
            
            // Draw progress circle
            let prog = Math.min(1, this.rot / this.reqRots);
            ctx.beginPath(); ctx.arc(cx, cy, maxR - 20, 0, Math.PI*2 * prog);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 20; ctx.stroke();

            // Center
            ctx.beginPath(); ctx.arc(cx, cy, 20, 0, Math.PI*2);
            ctx.fillStyle = '#ff66aa'; ctx.fill();

            // Clear text
            if(prog >= 1) {
                ctx.fillStyle = '#0f0'; ctx.font = 'bold 40px var(--ui-font)';
                ctx.textAlign = 'center'; ctx.fillText("CLEAR", cx, cy - maxR - 20);
            }
            
            ctx.globalAlpha = 1;
        }
    }

    class HitText {
        constructor(x, y, val) {
            this.x = x; this.y = y; this.life = 1.0; this.val = val;
            if(val === 300) { this.t = '300'; this.c = '#66ccff'; this.s = 1.2; }
            else if(val === 100) { this.t = '100'; this.c = '#88ff44'; this.s = 1.0; }
            else if(val === 50) { this.t = '50'; this.c = '#ffcc22'; this.s = 0.8; }
            else { this.t = 'X'; this.c = '#ff4444'; this.s = 1.5; }
        }
        draw(ctx) {
            if (this.life <= 0) return;
            this.life -= 0.02; this.y -= 0.5; 
            let scale = this.s * (1 + (1 - this.life)*0.2); 
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.c; ctx.font = `900 ${40 * scale}px var(--score-font)`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = '#000'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
            ctx.fillText(this.t, this.x, this.y);
            ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0; ctx.globalAlpha = 1;
        }
    }

    function createParticleBurst(x, y, color) {
        for(let i=0; i<8; i++) {
            let ang = Math.random() * Math.PI * 2;
            let spd = Math.random() * 5 + 2;
            particles.push({
                x: x, y: y, vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
                life: 1.0, color: color, size: Math.random()*4+2
            });
        }
    }

    function registerHit(obj, val) {
        obj.active = false;
        stats.hits[val===0 ? 'miss' : val]++;
        
        if (val > 0) {
            stats.combo++;
            if (stats.combo > stats.maxCombo) stats.maxCombo = stats.combo;
            stats.score += val + (val * stats.combo * 0.1); 
            let heal = val === 300 ? 5 : (val === 100 ? 2 : 0.5);
            stats.health = Math.min(100, stats.health + heal);
            
            let px = obj.type === 'slider' ? obj.endX : (obj.type === 'spinner' ? width/2 : obj.x);
            let py = obj.type === 'slider' ? obj.endY : (obj.type === 'spinner' ? height/2 : obj.y);
            createParticleBurst(px, py, obj.color || '#fff');
            
            if(val === 300) screenFlash();
            
            let ct = document.getElementById('comboTxt');
            ct.classList.remove('combo-pulse'); void ct.offsetWidth; ct.classList.add('combo-pulse');
        } else {
            stats.combo = 0; stats.health -= 15; shakeAmount = 20; 
        }
        
        let tx = obj.type === 'spinner' ? width/2 : obj.x;
        let ty = obj.type === 'spinner' ? height/2 : obj.y;
        hitTexts.push(new HitText(tx, ty, val));
        updateHUD();
        
        if (stats.health <= 0) endGame(false);
    }

    function gameLoop() {
        if (gameState !== 'playing' && gameState !== 'editing') return;
        requestAnimationFrame(gameLoop);
        
        ctx.fillStyle = '#050505'; ctx.fillRect(0, 0, width, height);
        if (!ytPlayer || !ytPlayer.getCurrentTime) return;
        let tMs = ytPlayer.getCurrentTime() * 1000;

        ctx.save();
        if (shakeAmount > 0) {
            ctx.translate((Math.random()-0.5)*shakeAmount, (Math.random()-0.5)*shakeAmount);
            shakeAmount *= 0.8; if(shakeAmount < 0.5) shakeAmount = 0;
        }

        if(gameState === 'playing') {
            stats.health -= 0.05; 
            
            // Check expirations
            for (let i = 0; i < activeObjects.length; i++) {
                let obj = activeObjects[i];
                if (!obj.active) continue;
                
                if (obj.type === 'circle' && tMs > obj.targetTime + HIT_WINDOWS.miss) {
                    registerHit(obj, 0); 
                } else if (obj.type === 'slider' && tMs > obj.endTime) {
                    // Slider finished
                    if(obj.isTracking) registerHit(obj, obj.startHitVal); // Success if held to end
                    else registerHit(obj, 0); // Missed or let go early
                } else if (obj.type === 'spinner' && tMs > obj.endTime) {
                    if(obj.rot >= obj.reqRots) registerHit(obj, 300);
                    else registerHit(obj, 0);
                }
            }
            
            if (ytDuration > 0 && tMs >= ytDuration * 1000 - 1000) endGame(true);
        }

        // Cleanup
        activeObjects = activeObjects.filter(c => c.active || (tMs - (c.endTime || c.targetTime) < 1000));
        hitTexts = hitTexts.filter(h => h.life > 0);

        // Render Trail
        cursorTrail.push({ x: mouseX, y: mouseY, l: 1.0 });
        if (cursorTrail.length > 30) cursorTrail.shift();
        ctx.beginPath();
        for(let i=0; i<cursorTrail.length; i++) {
            let p = cursorTrail[i]; p.l -= 0.05;
            if(p.l <= 0) continue;
            ctx.lineWidth = 14 * p.l; ctx.strokeStyle = `rgba(255, 102, 170, ${p.l})`; ctx.lineCap = 'round';
            if(i===0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Render Particles
        for (let i=particles.length-1; i>=0; i--) {
            let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.03;
            if(p.life <= 0) { particles.splice(i,1); continue; }
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Render Objects (reverse)
        for (let i = activeObjects.length - 1; i >= 0; i--) activeObjects[i].draw(ctx, tMs);
        for (let i=0; i<hitTexts.length; i++) hitTexts[i].draw(ctx);

        // Cursor
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 15, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255, 150, 200, 0.3)'; ctx.fill();
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 8, 0, Math.PI*2);
        ctx.fillStyle = '#ff66aa'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();

        ctx.restore();
        
        if(gameState === 'editing') updateHUD(); // update timeline
    }

    function generateAutoMap(duration, diff) {
        let map = [];
        let seed = currentVidId.charCodeAt(0) + currentVidId.charCodeAt(currentVidId.length-1);
        const random = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        
        approachRate = diff === 'hard' ? 900 : (diff === 'easy' ? 1800 : 1200);
        let interval = diff === 'hard' ? 350 : (diff === 'easy' ? 800 : 500);
        let pad = circleRadius * 1.5;
        let cIdx = 0; let num = 1;
        
        for (let t = 2000; t < duration * 1000 - 3000; t += interval) {
            let x = pad + random() * (width - pad*2); let y = pad + random() * (height - pad*2);
            let r = random();
            
            if (r > 0.8 && diff !== 'easy') interval = 250; 
            else if (r > 0.4) interval = diff === 'hard' ? 350 : 500;
            else interval = diff === 'easy' ? 800 : 600;

            if (num > 6 || random() > 0.8) { num = 1; cIdx++; } 
            
            // Generate some sliders/spinners procedurally
            let typeRand = random();
            let exactTime = t + (random()*40-20);
            
            if (typeRand > 0.85 && t < duration * 1000 - 5000) {
                // Spinner
                map.push(new Spinner(exactTime, 2000));
                t += 2000; // skip time
                num = 1; cIdx++;
            } else if (typeRand > 0.65) {
                // Slider
                let ex = Math.max(pad, Math.min(width-pad, x + (random()>0.5?1:-1) * 300));
                let ey = Math.max(pad, Math.min(height-pad, y + (random()>0.5?1:-1) * 300));
                map.push(new Slider(exactTime, x, y, ex, ey, cIdx, num++));
                t += 600;
            } else {
                map.push(new Circle(exactTime, x, y, cIdx, num++));
            }
        }
        return map.sort((a,b) => a.targetTime - b.targetTime);
    }

    function loadCustomMapToObjects() {
        activeObjects = [];
        let cIdx = 0, num = 1;
        // Map simple JSON array to class instances
        customBeatmap.sort((a,b)=>a.time-b.time).forEach(n => {
            activeObjects.push(new Circle(n.time, n.x, n.y, cIdx, num++));
            if(num > 5) { num = 1; cIdx++; }
        });
    }

    ctx.fillStyle = '#050505'; ctx.fillRect(0,0,width,height);
</script>
