<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>osu! Web Ultimate</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Varela+Round&family=Torus:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --ui-font: 'Varela Round', sans-serif;
            --score-font: 'Torus', 'Varela Round', sans-serif;
            --primary: #ff66aa;
            --primary-hover: #ff88bb;
        }

        html, body {
            margin: 0; padding: 0; overflow: hidden;
            width: 100vw; height: 100vh;
            background-color: #050505; font-family: var(--ui-font);
            color: white; user-select: none; -webkit-user-select: none;
            touch-action: none; /* Prevents mobile scrolling */
            cursor: none; /* Hide default cursor */
        }

        /* YouTube Background */
        #ytContainer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.15; z-index: -1; pointer-events: none; /* CRITICAL FIX: prevents iframe from stealing clicks */
            transition: opacity 0.5s ease;
        }
        .playing-dim { opacity: 0.05 !important; }

        /* Canvas */
        #gameCanvas {
            display: block; width: 100%; height: 100%;
            position: absolute; top: 0; left: 0; z-index: 10;
        }

        /* UI Overlay */
        .ui-layer {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 20; display: flex; flex-direction: column;
            justify-content: center; align-items: center; pointer-events: none;
        }

        /* Glassmorphism Menus */
        .glass-panel {
            pointer-events: auto; background: rgba(15, 10, 20, 0.7);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 102, 170, 0.2); border-radius: 24px;
            padding: 3rem; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), inset 0 0 20px rgba(255, 102, 170, 0.05);
            width: 90%; max-width: 500px; text-align: center;
        }

        /* Inputs & Buttons */
        .input-box {
            width: 100%; padding: 14px 20px; border-radius: 12px;
            background: rgba(0, 0, 0, 0.5); border: 2px solid rgba(255, 102, 170, 0.3);
            color: white; font-family: var(--ui-font); font-size: 1rem; margin-bottom: 1.5rem;
            transition: all 0.2s; pointer-events: auto;
        }
        .input-box:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 15px rgba(255, 102, 170, 0.4); }

        .btn {
            background: var(--primary); border: none; color: white;
            padding: 14px 28px; font-size: 1.1rem; font-weight: bold; font-family: var(--ui-font);
            border-radius: 50px; cursor: pointer; pointer-events: auto;
            box-shadow: 0 5px 20px rgba(255, 102, 170, 0.3);
            transition: transform 0.1s, background 0.2s, box-shadow 0.2s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn:hover { background: var(--primary-hover); transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255, 102, 170, 0.5); }
        .btn:active { transform: translateY(2px); box-shadow: 0 2px 10px rgba(255, 102, 170, 0.3); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); box-shadow: none; color: var(--primary); }
        .btn-outline:hover { background: rgba(255, 102, 170, 0.1); }

        .hidden { display: none !important; }

        .hud { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 15; }
        
        .hud-health-bg {
            position: absolute; top: 15px; left: 15px; width: 35vw; height: 18px;
            background: rgba(0,0,0,0.7); border: 2px solid rgba(255,255,255,0.8);
            border-radius: 10px; overflow: hidden; transform: skewX(-15deg);
        }
        .hud-health-fill {
            height: 100%; width: 100%; background: linear-gradient(90deg, #ff3333, #ffcc00, #33ff55);
            transition: width 0.1s linear;
        }

        .hud-score { position: absolute; top: 10px; right: 20px; text-align: right; }
        .hud-score-text { font-family: var(--score-font); font-size: 3.5rem; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 5px #000, 0 0 10px rgba(0,0,0,0.8); line-height: 1; }
        .hud-acc-text { font-family: var(--score-font); font-size: 1.8rem; font-weight: bold; color: #e0e0e0; text-shadow: 0 2px 4px #000; }

        .hud-combo {
            position: absolute; bottom: 20px; left: 20px;
            font-family: var(--score-font); font-size: 4.5rem; font-weight: 900;
            text-shadow: 0 3px 6px #000, 0 0 15px rgba(0,0,0,0.5);
            transition: transform 0.05s; transform-origin: bottom left;
        }
        .combo-pulse { transform: scale(1.15); color: var(--primary); }

        /* Key Input Visualizer */
        .key-visualizer {
            position: absolute; top: 50%; right: 20px; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 8px;
        }
        .key-box {
            width: 45px; height: 45px; border-radius: 8px; border: 2px solid rgba(255,255,255,0.4);
            display: flex; justify-content: center; align-items: center;
            font-size: 1.2rem; font-weight: bold; font-family: var(--score-font);
            background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.4); transition: all 0.05s;
        }
        .key-active { background: var(--primary); border-color: #fff; color: #fff; box-shadow: 0 0 15px var(--primary); transform: scale(0.9); }

        /* Grades */
        .grade-SS { color: #e4e4e4; text-shadow: 0 0 30px #fff, 0 0 10px #fff; }
        .grade-S { color: #ffd700; text-shadow: 0 0 30px #ffd700, 0 0 10px #ffd700; }
        .grade-A { color: #33ff55; text-shadow: 0 0 30px #33ff55; }
        .grade-B { color: #33aaff; text-shadow: 0 0 30px #33aaff; }
        .grade-C { color: #ff8800; text-shadow: 0 0 30px #ff8800; }
        .grade-D { color: #ff3333; text-shadow: 0 0 30px #ff3333; }
        
        .progress-bar-container { position: absolute; bottom: 0; left: 0; width: 100%; height: 6px; background: rgba(0,0,0,0.6); }
        .progress-bar-fill { height: 100%; width: 0%; background: var(--primary); box-shadow: 0 0 10px var(--primary); }
    </style>
</head>
<body>

<!-- YouTube Background -->
<div id="ytContainer"><div id="ytPlayer"></div></div>

<!-- Main Game Canvas -->
<canvas id="gameCanvas"></canvas>

<div id="mainMenu" class="ui-layer">
    <div class="glass-panel">
        <h1 class="text-6xl font-black mb-1" style="color: var(--primary); text-shadow: 0 0 25px rgba(255,102,170,0.6);">osu!</h1>
        <p class="text-sm font-bold tracking-widest text-pink-300 mb-8 opacity-80">WEB ULTIMATE</p>
        
        <input type="text" id="ytInput" class="input-box" placeholder="YouTube Video URL" value="https://www.youtube.com/watch?v=dQw4w9WgXcQ">
        <select id="diffSelect" class="input-box">
            <option value="easy">Easy</option>
            <option value="normal" selected>Normal</option>
            <option value="hard">Hard</option>
        </select>
        
        <div class="flex flex-col gap-3 mt-2">
            <button class="btn w-full" id="btnPlay">Play</button>
            <button class="btn btn-outline w-full" id="btnRankings">Global Rankings</button>
        </div>
        <p id="loadingText" class="mt-4 text-pink-400 font-bold hidden animate-pulse">Loading Beatmap...</p>
    </div>
</div>

<div id="hud" class="hud hidden">
    <div class="hud-health-bg"><div id="healthFill" class="hud-health-fill"></div></div>
    
    <div class="hud-score">
        <div id="scoreTxt" class="hud-score-text">00000000</div>
        <div id="accTxt" class="hud-acc-text">100.00%</div>
    </div>
    
    <div id="comboTxt" class="hud-combo">0x</div>
    
    <div class="key-visualizer">
        <div id="keyM1" class="key-box text-xs">M1</div>
        <div id="keyM2" class="key-box text-xs">M2</div>
        <div id="keyZ" class="key-box">Z</div>
        <div id="keyX" class="key-box">X</div>
    </div>
    
    <div class="progress-bar-container"><div id="songProgress" class="progress-bar-fill"></div></div>
</div>

<div id="resultsScreen" class="ui-layer hidden">
    <div class="glass-panel" style="max-width: 700px; width: 95%;">
        <div class="flex justify-between items-center border-b border-pink-900 pb-4 mb-6">
            <div class="text-left">
                <h2 id="resTitle" class="text-4xl font-black text-pink-400 uppercase">Map Cleared</h2>
                <p id="resDiff" class="text-gray-400 font-bold">Difficulty: Normal</p>
            </div>
            <div id="resGrade" class="text-8xl font-black grade-S" style="line-height: 0.8;">S</div>
        </div>
        
        <div class="flex flex-col md:flex-row gap-6 mb-6">
            <div class="flex-1 text-left bg-black bg-opacity-40 p-5 rounded-xl border border-gray-800">
                <p class="text-gray-400 font-bold text-sm tracking-widest">TOTAL SCORE</p>
                <p id="resScore" class="text-5xl font-black font-[Torus] mb-4">00000000</p>
                <div class="flex justify-between mt-2">
                    <div><p class="text-gray-400 font-bold text-xs">MAX COMBO</p><p id="resMaxCombo" class="text-2xl font-bold font-[Torus]">0x</p></div>
                    <div class="text-right"><p class="text-gray-400 font-bold text-xs">ACCURACY</p><p id="resAcc" class="text-2xl font-bold font-[Torus]">100.00%</p></div>
                </div>
            </div>
            <div class="w-full md:w-1/3 grid grid-cols-2 gap-3 text-left bg-black bg-opacity-40 p-5 rounded-xl border border-gray-800 font-bold text-xl font-[Torus]">
                <div style="color: #66ccff;">300: <span id="r300">0</span></div>
                <div style="color: #88ff44;">100: <span id="r100">0</span></div>
                <div style="color: #ffcc22;">50: <span id="r50">0</span></div>
                <div style="color: #ff4444;">Miss: <span id="rMiss">0</span></div>
            </div>
        </div>

        <div id="lbSubmitSection" class="mb-6 p-5 bg-pink-900 bg-opacity-20 border border-pink-700 rounded-xl hidden">
            <p class="text-pink-300 font-bold mb-3 text-left">Submit High Score to Global Rankings</p>
            <div class="flex gap-2">
                <input type="text" id="playerName" class="input-box m-0 flex-1" placeholder="Enter your name" maxlength="15">
                <button id="btnSubmitScore" class="btn px-8">Submit</button>
            </div>
            <p id="submitStatus" class="mt-2 text-sm text-green-400 font-bold hidden">Score submitted!</p>
        </div>
        
        <button id="btnBackMenu" class="btn btn-outline w-full">Back to Menu</button>
    </div>
</div>

<div id="leaderboardScreen" class="ui-layer hidden">
    <div class="glass-panel" style="max-width: 600px; width: 95%;">
        <h2 class="text-3xl font-black text-pink-400 mb-4 border-b border-pink-900 pb-3 uppercase tracking-wider">Global Rankings</h2>
        <div id="lbList" class="text-left overflow-y-auto max-h-[50vh] mb-6 pr-2" style="scrollbar-width: thin; scrollbar-color: var(--primary) transparent;">
            <p class="text-center text-pink-300 animate-pulse py-10">Connecting to database...</p>
        </div>
        <button id="btnCloseLB" class="btn btn-outline w-full">Close</button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Global variables exposed for the non-module script
    window.appId = typeof __app_id !== 'undefined' ? __app_id : 'osu-ultimate-web';
    let db, auth, user, isReady = false;

    async function initFb() {
        try {
            if (typeof __firebase_config !== 'undefined') {
                const app = initializeApp(JSON.parse(__firebase_config));
                db = getFirestore(app);
                auth = getAuth(app);
                if (typeof __initial_auth_token !== 'undefined') {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                user = auth.currentUser;
                isReady = !!user;
            }
        } catch (e) { console.warn("Firebase offline.", e); }
    }
    initFb();

    window.fbDb = () => db;
    window.fbUser = () => user;
    window.fbReady = () => isReady;
    window.fbAddDoc = addDoc;
    window.fbCollection = collection;
    window.fbGetDocs = getDocs;
    window.fbTimestamp = serverTimestamp;
</script>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    let width, height;

    function resize() {
        width = window.innerWidth;
        height = window.innerHeight;
        canvas.width = width;
        canvas.height = height;
    }
    window.addEventListener('resize', resize);
    resize();

    // Game Constants
    const COLORS = ['#00AAFF', '#FF00AA', '#00FF22', '#FFAA00'];
    let approachRate = 1200; // ms
    let circleRadius = 55;
    const HIT_WINDOWS = { 300: 50, 100: 100, 50: 150, miss: 200 };

    // State
    let gameState = 'menu'; // menu, playing, results
    let currentMap = [];
    let activeCircles = [];
    let hitTexts = [];
    let particles = [];
    let cursorTrail = [];
    let shakeAmount = 0;

    // Track mouse globally relative to canvas (CRITICAL FIX)
    let mouseX = width / 2;
    let mouseY = height / 2;
    
    // Key state for visualizer
    const inputState = { m1: false, m2: false, z: false, x: false };

    // Player Stats
    let stats = { score: 0, combo: 0, maxCombo: 0, health: 100, hits: {300:0, 100:0, 50:0, miss:0} };

    // YouTube API Integration
    let ytPlayer, ytDuration = 0, currentVidId = '';
    
    window.onYouTubeIframeAPIReady = function() {
        ytPlayer = new YT.Player('ytPlayer', {
            height: '100%', width: '100%',
            playerVars: { controls: 0, disablekb: 1, fs: 0, rel: 0, showinfo: 0, modestbranding: 1, iv_load_policy: 3 },
            events: { onStateChange: onYTStateChange }
        });
    };
    
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(tag);

    function extractVidId(url) {
        let m = url.match(/(?:youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/);
        return (m && m[1].length === 11) ? m[1] : 'dQw4w9WgXcQ';
    }

    
    function updateMousePos(e) {
        // getBoundingClientRect ensures absolute pixel accuracy even if scaling occurs
        const rect = canvas.getBoundingClientRect();
        mouseX = e.clientX - rect.left;
        mouseY = e.clientY - rect.top;
    }

    // Keep mouse coordinates constantly updated
    window.addEventListener('mousemove', updateMousePos);

    function attemptHit() {
        if (gameState !== 'playing' || !ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;
        
        let tMs = ytPlayer.getCurrentTime() * 1000;
        
        // Find earliest circle we are hovering over
        for (let i = 0; i < activeCircles.length; i++) {
            let c = activeCircles[i];
            if (!c.active || tMs < c.spawnTime) continue; // Not spawned yet
            
            let dist = Math.hypot(mouseX - c.x, mouseY - c.y);
            if (dist <= circleRadius) {
                let timeDiff = Math.abs(tMs - c.targetTime);
                
                // Only register if within miss window. If we click WAY too early, ignore it.
                if (timeDiff <= HIT_WINDOWS.miss) {
                    let scoreVal = 0;
                    if (timeDiff <= HIT_WINDOWS[300]) scoreVal = 300;
                    else if (timeDiff <= HIT_WINDOWS[100]) scoreVal = 100;
                    else if (timeDiff <= HIT_WINDOWS[50]) scoreVal = 50;
                    
                    registerHit(c, scoreVal);
                    return; // Important: Only hit ONE circle per click
                }
            }
        }
    }

    // Mouse Input
    window.addEventListener('mousedown', (e) => {
        if(gameState === 'playing') e.preventDefault(); // Stop default browser actions
        updateMousePos(e);
        
        if (e.button === 0) { inputState.m1 = true; attemptHit(); }
        if (e.button === 2) { inputState.m2 = true; attemptHit(); }
        updateKeyUI();
    }, { passive: false });

    window.addEventListener('mouseup', (e) => {
        if (e.button === 0) inputState.m1 = false;
        if (e.button === 2) inputState.m2 = false;
        updateKeyUI();
    });

    // Keyboard Input (Z and X)
    window.addEventListener('keydown', (e) => {
        if (e.repeat) return; // Prevent hold-down auto-repeat
        let k = e.key.toLowerCase();
        
        if (k === 'z' || k === 'x') {
            if(gameState === 'playing') e.preventDefault(); // Prevent scrolling
            inputState[k] = true;
            attemptHit(); // Triggers hit using current mouseX/mouseY
            updateKeyUI();
        }
    }, { passive: false });

    window.addEventListener('keyup', (e) => {
        let k = e.key.toLowerCase();
        if (k === 'z' || k === 'x') {
            inputState[k] = false;
            updateKeyUI();
        }
    });

    // Disable context menu so right click (M2) works cleanly
    window.addEventListener('contextmenu', e => { if(gameState === 'playing') e.preventDefault(); });

    // Touch support (mobile)
    window.addEventListener('touchstart', (e) => {
        if(gameState === 'playing') e.preventDefault();
        const rect = canvas.getBoundingClientRect();
        mouseX = e.touches[0].clientX - rect.left;
        mouseY = e.touches[0].clientY - rect.top;
        inputState.m1 = true;
        attemptHit();
        updateKeyUI();
    }, { passive: false });
    
    window.addEventListener('touchend', (e) => {
        inputState.m1 = false;
        updateKeyUI();
    });


    
    class Circle {
        constructor(time, x, y, colorIdx, num) {
            this.targetTime = time;
            this.spawnTime = time - approachRate;
            this.x = x; this.y = y;
            this.color = COLORS[colorIdx % COLORS.length];
            this.num = num;
            this.active = true;
        }

        draw(ctx, tMs) {
            if (!this.active) return;
            let progress = (tMs - this.spawnTime) / approachRate;
            if (progress < 0 || progress > 1.2) return;

            let alpha = Math.min(1, progress * 4); // Fast fade in
            ctx.globalAlpha = alpha;

            // Base Circle
            ctx.beginPath();
            ctx.arc(this.x, this.y, circleRadius, 0, Math.PI * 2);
            let grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, circleRadius);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.2, this.color);
            grad.addColorStop(0.9, this.color);
            grad.addColorStop(1, '#111');
            ctx.fillStyle = grad;
            ctx.fill();

            // Borders
            ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
            ctx.beginPath(); ctx.arc(this.x, this.y, circleRadius+1, 0, Math.PI*2);
            ctx.lineWidth = 1; ctx.strokeStyle = '#000'; ctx.stroke();

            // Number
            ctx.fillStyle = '#fff';
            ctx.font = `bold ${circleRadius * 0.8}px var(--ui-font)`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = 'rgba(0,0,0,0.6)'; ctx.shadowBlur = 4;
            ctx.fillText(this.num, this.x, this.y + 2);
            ctx.shadowBlur = 0;

            // Approach Circle
            if (progress <= 1.0) {
                let scale = 1 + 2 * (1 - progress); // Starts at 3x, shrinks to 1x
                ctx.beginPath();
                ctx.arc(this.x, this.y, circleRadius * scale, 0, Math.PI * 2);
                ctx.lineWidth = 4; ctx.strokeStyle = this.color; ctx.stroke();
            }
            ctx.globalAlpha = 1;
        }
    }

    class HitText {
        constructor(x, y, val) {
            this.x = x; this.y = y; this.life = 1.0; this.val = val;
            if(val === 300) { this.t = '300'; this.c = '#66ccff'; this.s = 1.2; }
            else if(val === 100) { this.t = '100'; this.c = '#88ff44'; this.s = 1.0; }
            else if(val === 50) { this.t = '50'; this.c = '#ffcc22'; this.s = 0.8; }
            else { this.t = 'X'; this.c = '#ff4444'; this.s = 1.5; }
        }
        draw(ctx) {
            if (this.life <= 0) return;
            this.life -= 0.02;
            this.y -= 0.5; // Float up slightly
            
            let scale = this.s * (1 + (1 - this.life)*0.2); // Expand slightly as it fades
            
            ctx.globalAlpha = Math.max(0, this.life);
            ctx.fillStyle = this.c;
            ctx.font = `900 ${40 * scale}px var(--score-font)`;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            
            // Text shadow
            ctx.shadowColor = '#000'; ctx.shadowBlur = 6; ctx.shadowOffsetX = 2; ctx.shadowOffsetY = 2;
            ctx.fillText(this.t, this.x, this.y);
            ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
            ctx.globalAlpha = 1;
        }
    }

    function createParticleBurst(x, y, color) {
        for(let i=0; i<8; i++) {
            let ang = Math.random() * Math.PI * 2;
            let spd = Math.random() * 5 + 2;
            particles.push({
                x: x, y: y,
                vx: Math.cos(ang)*spd, vy: Math.sin(ang)*spd,
                life: 1.0, color: color, size: Math.random()*4+2
            });
        }
    }

    function registerHit(circle, val) {
        circle.active = false;
        stats.hits[val===0 ? 'miss' : val]++;
        
        if (val > 0) {
            stats.combo++;
            if (stats.combo > stats.maxCombo) stats.maxCombo = stats.combo;
            stats.score += val + (val * stats.combo * 0.1); // Standard formula approximation
            
            // Healing
            let heal = val === 300 ? 5 : (val === 100 ? 2 : 0.5);
            stats.health = Math.min(100, stats.health + heal);
            
            createParticleBurst(circle.x, circle.y, circle.color);
            
            // UI Pulse
            let ct = document.getElementById('comboTxt');
            ct.classList.remove('combo-pulse'); void ct.offsetWidth; ct.classList.add('combo-pulse');
        } else {
            stats.combo = 0;
            stats.health -= 15; // Penalty
            shakeAmount = 15; // Screen shake
        }
        
        hitTexts.push(new HitText(circle.x, circle.y, val));
        updateHUD();
        
        if (stats.health <= 0) endGame(false);
    }

    
    function updateHUD() {
        document.getElementById('scoreTxt').innerText = Math.floor(stats.score).toString().padStart(8, '0');
        document.getElementById('comboTxt').innerText = stats.combo + 'x';
        
        let total = stats.hits[300] + stats.hits[100] + stats.hits[50] + stats.hits.miss;
        let acc = total === 0 ? 100 : ((stats.hits[300]*300 + stats.hits[100]*100 + stats.hits[50]*50) / (total*300) * 100);
        document.getElementById('accTxt').innerText = acc.toFixed(2) + '%';
        
        document.getElementById('healthFill').style.width = Math.max(0, stats.health) + '%';
        
        if (ytPlayer && ytDuration > 0) {
            let p = (ytPlayer.getCurrentTime() / ytDuration) * 100;
            document.getElementById('songProgress').style.width = p + '%';
        }
    }

    function updateKeyUI() {
        document.getElementById('keyZ').classList.toggle('key-active', inputState.z);
        document.getElementById('keyX').classList.toggle('key-active', inputState.x);
        document.getElementById('keyM1').classList.toggle('key-active', inputState.m1);
        document.getElementById('keyM2').classList.toggle('key-active', inputState.m2);
    }

    function gameLoop() {
        if (gameState !== 'playing') return;
        requestAnimationFrame(gameLoop);
        
        // Background clear (solid black for performance and clean trails)
        ctx.fillStyle = '#050505';
        ctx.fillRect(0, 0, width, height);

        if (!ytPlayer || !ytPlayer.getCurrentTime) return;
        let tMs = ytPlayer.getCurrentTime() * 1000;

        // Apply Screen Shake
        ctx.save();
        if (shakeAmount > 0) {
            let dx = (Math.random() - 0.5) * shakeAmount;
            let dy = (Math.random() - 0.5) * shakeAmount;
            ctx.translate(dx, dy);
            shakeAmount *= 0.8; // Decay
            if(shakeAmount < 0.5) shakeAmount = 0;
        }

        // Logic Updates
        stats.health -= 0.05; // Constant drain
        
        // Miss check
        for (let i = 0; i < activeCircles.length; i++) {
            let c = activeCircles[i];
            if (c.active && tMs > c.targetTime + HIT_WINDOWS.miss) {
                registerHit(c, 0); // Completely missed the window
            }
        }
        
        // Clean up memory
        activeCircles = activeCircles.filter(c => c.active || (tMs - c.targetTime < 1000));
        hitTexts = hitTexts.filter(h => h.life > 0);
        
        // Win condition
        if (ytDuration > 0 && tMs >= ytDuration * 1000 - 1000) {
            endGame(true);
        }

        // --- RENDERING ---

        // Cursor Trail
        cursorTrail.push({ x: mouseX, y: mouseY, l: 1.0 });
        if (cursorTrail.length > 25) cursorTrail.shift();
        
        ctx.beginPath();
        for(let i=0; i<cursorTrail.length; i++) {
            let p = cursorTrail[i];
            p.l -= 0.05;
            if(p.l <= 0) continue;
            ctx.lineWidth = 12 * p.l;
            ctx.strokeStyle = `rgba(255, 102, 170, ${p.l})`;
            ctx.lineCap = 'round';
            if(i===0) ctx.moveTo(p.x, p.y);
            else ctx.lineTo(p.x, p.y);
        }
        ctx.stroke();

        // Particles
        for (let i=particles.length-1; i>=0; i--) {
            let p = particles[i];
            p.x += p.vx; p.y += p.vy; p.life -= 0.03;
            if(p.life <= 0) { particles.splice(i,1); continue; }
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
            ctx.fillStyle = p.color; ctx.globalAlpha = p.life; ctx.fill();
        }
        ctx.globalAlpha = 1;

        // Draw Circles (Reverse order so newest/earliest are on top)
        for (let i = activeCircles.length - 1; i >= 0; i--) {
            activeCircles[i].draw(ctx, tMs);
        }

        // Draw Score Popups
        for (let i=0; i<hitTexts.length; i++) hitTexts[i].draw(ctx);

        // Custom Osu Cursor
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 15, 0, Math.PI*2);
        ctx.fillStyle = 'rgba(255, 150, 200, 0.3)'; ctx.fill();
        ctx.beginPath(); ctx.arc(mouseX, mouseY, 8, 0, Math.PI*2);
        ctx.fillStyle = '#ff66aa'; ctx.fill();
        ctx.lineWidth = 2; ctx.strokeStyle = '#fff'; ctx.stroke();

        ctx.restore(); // Restore from shake translation
    }


    
    function generateMap(duration, diff) {
        let map = [];
        let seed = currentVidId.charCodeAt(0) + currentVidId.charCodeAt(currentVidId.length-1);
        const random = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
        
        approachRate = diff === 'hard' ? 900 : (diff === 'easy' ? 1800 : 1200);
        let interval = diff === 'hard' ? 350 : (diff === 'easy' ? 800 : 500);
        let pad = circleRadius * 1.5;
        
        let cIdx = 0; let num = 1;
        
        for (let t = 2000; t < duration * 1000 - 3000; t += interval) {
            let x = pad + random() * (width - pad*2);
            let y = pad + random() * (height - pad*2);
            
            // Randomize interval slightly for rhythm feel
            let r = random();
            if (r > 0.8 && diff !== 'easy') interval = 250; // fast stream
            else if (r > 0.4) interval = diff === 'hard' ? 350 : 500;
            else interval = diff === 'easy' ? 800 : 600;

            if (num > 6 || random() > 0.8) { num = 1; cIdx++; } // Combo break
            
            map.push(new Circle(t + (random()*40-20), x, y, cIdx, num++));
        }
        return map.sort((a,b) => a.targetTime - b.targetTime);
    }

    function onYTStateChange(e) {
        if (e.data === YT.PlayerState.PLAYING && gameState === 'loading') {
            ytDuration = ytPlayer.getDuration();
            document.getElementById('loadingText').classList.add('hidden');
            
            activeCircles = generateMap(ytDuration, document.getElementById('diffSelect').value);
            
            gameState = 'playing';
            document.getElementById('mainMenu').classList.add('hidden');
            document.getElementById('hud').classList.remove('hidden');
            document.getElementById('ytContainer').classList.add('playing-dim');
            
            requestAnimationFrame(gameLoop);
        }
    }

    document.getElementById('btnPlay').addEventListener('click', () => {
        if (!ytPlayer || !ytPlayer.loadVideoById) return;
        
        let url = document.getElementById('ytInput').value;
        currentVidId = extractVidId(url);
        
        gameState = 'loading';
        document.getElementById('loadingText').classList.remove('hidden');
        
        // Reset stats
        stats = { score: 0, combo: 0, maxCombo: 0, health: 100, hits: {300:0, 100:0, 50:0, miss:0} };
        activeCircles = []; hitTexts = []; particles = []; cursorTrail = []; shakeAmount = 0;
        updateHUD();
        
        ytPlayer.loadVideoById(currentVidId);
        ytPlayer.setVolume(50);
    });

    function endGame(cleared) {
        gameState = 'results';
        if(ytPlayer) ytPlayer.pauseVideo();
        
        document.getElementById('hud').classList.add('hidden');
        document.getElementById('ytContainer').classList.remove('playing-dim');
        document.getElementById('resultsScreen').classList.remove('hidden');
        
        document.getElementById('resTitle').innerText = cleared ? "Beatmap Cleared" : "Beatmap Failed";
        document.getElementById('resTitle').style.color = cleared ? "#ff66aa" : "#ff3333";
        document.getElementById('resDiff').innerText = `Difficulty: ${document.getElementById('diffSelect').value.toUpperCase()}`;
        
        let total = stats.hits[300] + stats.hits[100] + stats.hits[50] + stats.hits.miss;
        let acc = total === 0 ? 100 : ((stats.hits[300]*300 + stats.hits[100]*100 + stats.hits[50]*50) / (total*300) * 100);
        let grade = !cleared ? 'D' : (acc === 100 ? 'SS' : acc > 95 ? 'S' : acc > 90 ? 'A' : acc > 80 ? 'B' : acc > 70 ? 'C' : 'D');
        
        let gEl = document.getElementById('resGrade');
        gEl.innerText = grade;
        gEl.className = `text-8xl font-black grade-${grade}`;
        
        document.getElementById('resScore').innerText = Math.floor(stats.score).toString().padStart(8, '0');
        document.getElementById('resMaxCombo').innerText = stats.maxCombo + 'x';
        document.getElementById('resAcc').innerText = acc.toFixed(2) + '%';
        
        document.getElementById('r300').innerText = stats.hits[300];
        document.getElementById('r100').innerText = stats.hits[100];
        document.getElementById('r50').innerText = stats.hits[50];
        document.getElementById('rMiss').innerText = stats.hits.miss;

        if(cleared && window.fbReady && window.fbReady()) {
            document.getElementById('lbSubmitSection').classList.remove('hidden');
            document.getElementById('submitStatus').classList.add('hidden');
            document.getElementById('btnSubmitScore').disabled = false;
        } else {
            document.getElementById('lbSubmitSection').classList.add('hidden');
        }
    }

    document.getElementById('btnBackMenu').addEventListener('click', () => {
        gameState = 'menu';
        document.getElementById('resultsScreen').classList.add('hidden');
        document.getElementById('mainMenu').classList.remove('hidden');
        ctx.fillStyle = '#050505'; ctx.fillRect(0,0,width,height);
    });

    
    document.getElementById('btnSubmitScore').addEventListener('click', async () => {
        let name = document.getElementById('playerName').value.trim() || 'Guest';
        let btn = document.getElementById('btnSubmitScore');
        btn.disabled = true;
        
        let total = stats.hits[300] + stats.hits[100] + stats.hits[50] + stats.hits.miss;
        let acc = total === 0 ? 100 : ((stats.hits[300]*300 + stats.hits[100]*100 + stats.hits[50]*50) / (total*300) * 100);

        try {
            const colRef = window.fbCollection(window.fbDb(), 'artifacts', window.appId, 'public', 'data', 'osu_leaderboard');
            await window.fbAddDoc(colRef, {
                name: name, score: Math.floor(stats.score),
                accuracy: parseFloat(acc.toFixed(2)), combo: stats.maxCombo,
                videoId: currentVidId, difficulty: document.getElementById('diffSelect').value,
                userId: window.fbUser().uid, timestamp: window.fbTimestamp()
            });
            document.getElementById('submitStatus').classList.remove('hidden');
        } catch (e) {
            console.error(e);
            btn.disabled = false;
        }
    });

    document.getElementById('btnRankings').addEventListener('click', async () => {
        document.getElementById('mainMenu').classList.add('hidden');
        document.getElementById('leaderboardScreen').classList.remove('hidden');
        let list = document.getElementById('lbList');
        
        if (!window.fbReady || !window.fbReady()) {
            list.innerHTML = '<p class="text-center text-red-400 py-10">Database offline.</p>';
            return;
        }
        
        list.innerHTML = '<p class="text-center text-pink-300 animate-pulse py-10">Fetching scores...</p>';
        
        try {
            const colRef = window.fbCollection(window.fbDb(), 'artifacts', window.appId, 'public', 'data', 'osu_leaderboard');
            const snap = await window.fbGetDocs(colRef);
            let scores = [];
            snap.forEach(doc => scores.push(doc.data()));
            
            scores.sort((a,b) => b.score - a.score);
            
            if (scores.length === 0) {
                list.innerHTML = '<p class="text-center text-gray-400 py-10">No scores yet. Be the first!</p>';
                return;
            }

            let html = '';
            scores.slice(0, 50).forEach((s, i) => {
                let isTop = i < 3 ? 'text-pink-400' : 'text-gray-300';
                html += `
                    <div class="flex justify-between items-center p-3 border-b border-gray-800 bg-black bg-opacity-20 hover:bg-opacity-40 transition rounded-lg mb-1">
                        <div class="flex gap-4 items-center">
                            <span class="font-black text-xl ${isTop} w-8">#${i+1}</span>
                            <div>
                                <p class="font-bold text-white">${s.name} <span class="text-xs text-pink-500 bg-pink-900 bg-opacity-30 px-1 rounded ml-1">${s.difficulty}</span></p>
                                <p class="text-xs text-gray-400">${s.combo}x Max Combo</p>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-black font-[Torus] text-xl">${s.score}</p>
                            <p class="text-sm font-bold text-green-400">${s.accuracy}%</p>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
            
        } catch (e) {
            list.innerHTML = '<p class="text-center text-red-500 py-10">Error loading scores.</p>';
        }
    });

    document.getElementById('btnCloseLB').addEventListener('click', () => {
        document.getElementById('leaderboardScreen').classList.add('hidden');
        document.getElementById('mainMenu').classList.remove('hidden');
    });

    // Initial background paint
    ctx.fillStyle = '#050505'; ctx.fillRect(0,0,width,height);
</script>
